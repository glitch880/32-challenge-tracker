<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>32 Challenge</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/mana-font@1/css/mana.css">
<style>
  body{ font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; color:#1d1d1f; margin:0; padding:24px; }
  #app{ max-width:1400px; margin:0 auto; }
  h1{ font-size:34px; margin:0 0 2px; font-weight:700; letter-spacing:-.5px; }
  .sub{ font-size:13px; color:#6b6b70; margin-bottom:16px; }
  .shared-note{ color:#8a6d3b; }
  .tabs{ display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-bottom:16px; }
  .tab{ padding:7px 14px; border:1px solid #d8d8dc; background:#f5f5f7; border-radius:999px; cursor:pointer; font-size:14px; color:#333; display:flex; align-items:center; gap:6px; }
  .tab.active{ background:#1d1d1f; color:#fff; border-color:#1d1d1f; }
  .tab .x{ opacity:.5; font-size:13px; }
  .tab .x:hover{ opacity:1; }
  .add{ padding:7px 12px; border:1px dashed #bbb; background:none; border-radius:999px; cursor:pointer; font-size:14px; color:#555; }
  .status{ font-size:13px; color:#8a8a8f; margin-bottom:10px; min-height:18px; }
  /* ponytail: 16 = 32 identities / 2 cols; the "32 Challenge" count is fixed by definition */
  .sheet{ display:grid; grid-template-columns:1fr 1fr; grid-template-rows:repeat(16,auto); grid-auto-flow:column; gap:6px 28px; }
  @media (max-width:640px){ .sheet{ grid-template-columns:1fr; grid-template-rows:none; grid-auto-flow:row; } .desc{ margin-left:0; } }
  .row{ display:flex; flex-wrap:wrap; align-items:center; gap:10px; padding:4px 0; }
  .desc{ flex:1 0 100%; margin-left:202px; border:none; border-bottom:1px dashed #dcdce0; background:none; padding:3px 2px; font-size:12px; color:#6b6b70; outline:none; }
  .desc:focus{ border-bottom-color:#1d1d1f; color:#1d1d1f; }
  .lock{ border:none; background:none; cursor:pointer; font-size:14px; line-height:1; padding:0 2px; flex:none; opacity:.65; }
  .lock:hover{ opacity:1; }
  .row.locked input.entry, .row.locked .desc{ color:#8a8a8f; }
  @media (min-width:1200px){ .desc{ flex:1 1 0; margin-left:0; min-width:0; } .wl{ order:1; } }
  .pips{ display:flex; gap:3px; width:132px; flex:none; }
  .pips .ms{ font-size:20px; }
  .name-tag{ font-size:10px; color:#9a9aa0; width:60px; flex:none; margin-left:-4px; }
  input.entry{ flex:1; border:none; border-bottom:1px solid #cfcfd4; background:none; padding:5px 2px; font-size:14px; color:#1d1d1f; outline:none; min-width:0; }
  input.entry:focus{ border-bottom-color:#1d1d1f; }
  .wl{ display:flex; align-items:center; gap:4px; flex:none; }
  .wl label{ font-size:10px; color:#9a9aa0; }
  .wstat,.lstat{ width:42px; border:1px solid #d8d8dc; border-radius:6px; padding:3px 4px; font-size:13px; color:#1d1d1f; outline:none; }
  .wstat:focus,.lstat:focus{ border-color:#1d1d1f; }
  #gate{ display:flex; gap:8px; align-items:center; margin:16px 0; }
  #gate input{ border:1px solid #d8d8dc; border-radius:8px; padding:8px 10px; font-size:14px; outline:none; }
  #gate input:focus{ border-color:#1d1d1f; }
  #gate button{ padding:8px 14px; border:none; border-radius:8px; background:#1d1d1f; color:#fff; font-size:14px; cursor:pointer; }
  #gate-msg{ font-size:13px; color:#d3413c; }
  #cardpreview{ position:fixed; display:none; z-index:1000; pointer-events:none; }
  #cardpreview img{ width:240px; border-radius:12px; box-shadow:0 8px 24px rgba(0,0,0,.35); display:block; }
</style>
</head>
<body>
<div id="app">
  <h1>32 Challenge</h1>
  <div class="sub">Commander color-identity tracker · <span class="shared-note">live-shared with everyone who has this link</span></div>
  <form id="gate" style="display:none">
    <input id="gate-pass" type="password" placeholder="passphrase" autocomplete="current-password">
    <button type="submit">Enter</button>
    <span id="gate-msg"></span>
  </form>
  <div id="tabs" class="tabs"></div>
  <div id="status" class="status">Connecting…</div>
  <div id="sheet" class="sheet"></div>
</div>
<div id="cardpreview"><img alt=""></div>

<!-- Firebase (compat build = no bundler needed) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script>
/* ============================================================
   1) PASTE YOUR FIREBASE CONFIG HERE (see the setup steps).
   Only databaseURL + apiKey + projectId are strictly needed
   for Realtime Database, but paste the whole object.
   ============================================================ */
const firebaseConfig = {
  apiKey: "AIzaSyBwXwdZso93ls8rc5VNUwgTXQhdiEZKSKs",
  authDomain: "commander-32.firebaseapp.com",
  databaseURL: "https://commander-32-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "commander-32",
  storageBucket: "commander-32.firebasestorage.app",
  messagingSenderId: "861515031209",
  appId: "1:861515031209:web:f4beedd0aed9d745033fb8",
  measurementId: "G-K7KX5L5ZYF"
};
/* ============================================================ */

const IDENTITIES = [
  {id:'c',name:'Colorless',c:['C']},
  {id:'w',name:'White',c:['W']},{id:'u',name:'Blue',c:['U']},{id:'b',name:'Black',c:['B']},
  {id:'r',name:'Red',c:['R']},{id:'g',name:'Green',c:['G']},
  {id:'wu',name:'Azorius',c:['W','U']},{id:'ub',name:'Dimir',c:['U','B']},{id:'br',name:'Rakdos',c:['B','R']},
  {id:'rg',name:'Gruul',c:['R','G']},{id:'gw',name:'Selesnya',c:['G','W']},{id:'wb',name:'Orzhov',c:['W','B']},
  {id:'ur',name:'Izzet',c:['U','R']},{id:'bg',name:'Golgari',c:['B','G']},{id:'rw',name:'Boros',c:['R','W']},
  {id:'gu',name:'Simic',c:['G','U']},
  {id:'gwu',name:'Bant',c:['G','W','U']},{id:'wub',name:'Esper',c:['W','U','B']},{id:'ubr',name:'Grixis',c:['U','B','R']},
  {id:'brg',name:'Jund',c:['B','R','G']},{id:'rgw',name:'Naya',c:['R','G','W']},
  {id:'wbg',name:'Abzan',c:['W','B','G']},{id:'urw',name:'Jeskai',c:['U','R','W']},{id:'bgu',name:'Sultai',c:['B','G','U']},
  {id:'rwb',name:'Mardu',c:['R','W','B']},{id:'gur',name:'Temur',c:['G','U','R']},
  {id:'wubr',name:'Artifice',c:['W','U','B','R']},{id:'ubrg',name:'Chaos',c:['U','B','R','G']},
  {id:'brgw',name:'Aggro',c:['B','R','G','W']},{id:'rgwu',name:'Altruism',c:['R','G','W','U']},
  {id:'gwub',name:'Growth',c:['G','W','U','B']},
  {id:'wubrg',name:'5-color',c:['W','U','B','R','G']}
];

// Non-secret: identifies the shared Firebase account. The passphrase (that account's
// password) is entered by the user and validated by Firebase Auth — never stored here.
const SHARED_EMAIL = "pod@32challenge.local";

const $tabs = document.getElementById('tabs');
const $sheet = document.getElementById('sheet');
const $status = document.getElementById('status');
const $gate = document.getElementById('gate');
const $gatePass = document.getElementById('gate-pass');
const $gateMsg = document.getElementById('gate-msg');

let db, root;
let people = {};      // pushId -> name
let entries = {};     // pushId -> {rowId: text}
let stats = {};       // pushId -> {rowId: {w,l}}
let tags = {};        // pushId -> {rowId: text}  (free-text description per deck)
let locks = {};       // pushId -> {rowId: true}  (locked rows: commander+desc read-only)
let current = null;   // pushId
let builtFor = null;  // which pushId the sheet DOM is built for
const saveTimers = {};
const acTimers = {};

const clampInt = v => Math.max(0, Math.floor(+v || 0));
console.assert(clampInt(-3)===0 && clampInt("2")===2 && clampInt("")===0, 'clampInt broken');

const uniq = a => [...new Set(a)];
console.assert(uniq(['a','a','b']).length===2, 'uniq broken');

// Debounced commander typeahead → fills the row's <datalist>.
// ponytail: 250ms debounce + min length keeps us within Scryfall's rate guidance.
function suggest(rowId, q){
  clearTimeout(acTimers[rowId]);
  if(q.trim().length < 2) return;
  acTimers[rowId]=setTimeout(()=>{
    fetch('https://api.scryfall.com/cards/search?order=name&q='+encodeURIComponent('is:commander '+q))
      .then(r=> r.ok ? r.json() : {data:[]})
      .then(j=>{
        const dl=document.getElementById('dl-'+rowId);
        if(!dl) return;
        dl.innerHTML = uniq((j.data||[]).map(c=>c.name)).slice(0,20)
          .map(n=>`<option value="${n.replace(/"/g,'&quot;')}">`).join('');
      }).catch(()=>{});
  },250);
}

function pips(colors){
  return '<div class="pips">' +
    colors.map(k=>`<i class="ms ms-${k.toLowerCase()} ms-cost"></i>`).join('') +
    '</div>';
}

let started = false;

function init(){
  try{
    firebase.initializeApp(firebaseConfig);
    db = firebase.database();
    root = db.ref('challenge');
  }catch(e){
    $status.textContent = 'Firebase not configured — paste your config at the top of the file.';
    return;
  }
  // Gate the app behind the shared account. Firebase persists the session, so members
  // enter the passphrase once per browser.
  firebase.auth().onAuthStateChanged(user=>{
    if(user){ $gate.style.display='none'; start(); }
    else { $gate.style.display='flex'; }
  });
  $gate.addEventListener('submit', e=>{
    e.preventDefault();
    $gateMsg.textContent='';
    firebase.auth().signInWithEmailAndPassword(SHARED_EMAIL, $gatePass.value)
      .catch(()=>{ $gateMsg.textContent='wrong passphrase'; });
  });
}

function start(){
  if(started) return;   // ponytail: attach the live listener exactly once
  started = true;
  root.on('value', snap=>{
    const data = snap.val() || {};
    people = data.people || {};
    entries = data.entries || {};
    stats = data.stats || {};
    tags = data.tags || {};
    locks = data.locks || {};
    const ids = Object.keys(people);
    if(!current || !ids.includes(current)) current = ids[0] || null;
    renderTabs();
    renderSheet();
    $status.textContent = '';
  }, err=>{
    $status.textContent = 'Read failed — check your database rules.';
  });
}

function renderTabs(){
  $tabs.innerHTML='';
  Object.entries(people).forEach(([id,name])=>{
    const b=document.createElement('div');
    b.className='tab'+(id===current?' active':'');
    b.innerHTML=`<span class="lbl"></span><span class="x">✕</span>`;
    b.querySelector('.lbl').textContent=name;
    b.querySelector('.lbl').onclick=()=>{ current=id; renderSheet(); renderTabs(); };
    b.querySelector('.x').onclick=(e)=>{ e.stopPropagation(); removePerson(id,name); };
    $tabs.appendChild(b);
  });
  const add=document.createElement('button');
  add.className='add'; add.textContent='+ add person'; add.onclick=addPerson;
  $tabs.appendChild(add);
}

function renderSheet(){
  if(!current){ $sheet.innerHTML='<div class="sub">No players yet — add one to start.</div>'; builtFor=null; return; }
  // Rebuild DOM only when switching person; otherwise just refresh values (keeps focus/cursor).
  if(builtFor !== current){
    $sheet.innerHTML='';
    IDENTITIES.forEach(idn=>{
      const row=document.createElement('div'); row.className='row'; row.dataset.row=idn.id;
      row.innerHTML = pips(idn.c) + `<span class="name-tag">${idn.name}</span>`;
      const lock=document.createElement('button');
      lock.className='lock'; lock.type='button';
      lock.onclick=()=>toggleLock(idn.id);
      row.appendChild(lock);
      const inp=document.createElement('input');
      inp.className='entry'; inp.placeholder='commander…'; inp.dataset.row=idn.id;
      inp.setAttribute('list','dl-'+idn.id); inp.autocomplete='off';
      inp.oninput=()=>{ saveField('entries', idn.id, inp.value); suggest(idn.id, inp.value); };
      row.appendChild(inp);
      const dl=document.createElement('datalist'); dl.id='dl-'+idn.id; row.appendChild(dl);
      row.insertAdjacentHTML('beforeend',
        `<span class="wl"><label>W</label><input type="number" min="0" class="wstat">`+
        `<label>L</label><input type="number" min="0" class="lstat"></span>`);
      row.querySelector('.wstat').onchange = ()=>saveStat(idn.id);
      row.querySelector('.lstat').onchange = ()=>saveStat(idn.id);
      const desc=document.createElement('input');
      desc.className='desc'; desc.placeholder='description / tags…'; desc.dataset.row=idn.id;
      desc.oninput=()=>saveField('tags', idn.id, desc.value);
      row.appendChild(desc);
      $sheet.appendChild(row);
    });
    builtFor = current;
  }
  const data = entries[current] || {};
  const scur = stats[current] || {};
  const tcur = tags[current] || {};
  const lcur = locks[current] || {};
  $sheet.querySelectorAll('.row').forEach(row=>{
    const id = row.dataset.row;
    const inp = row.querySelector('input.entry');
    if(inp !== document.activeElement) inp.value = data[id] || '';
    const s = scur[id] || {};
    const w = row.querySelector('.wstat'), l = row.querySelector('.lstat');
    if(w !== document.activeElement) w.value = s.w || 0;
    if(l !== document.activeElement) l.value = s.l || 0;
    const d = row.querySelector('.desc');
    if(d !== document.activeElement) d.value = tcur[id] || '';
    const locked = !!lcur[id];
    inp.readOnly = locked; d.readOnly = locked;
    row.classList.toggle('locked', locked);
    const lock = row.querySelector('.lock');
    lock.textContent = locked ? '🔒' : '🔓';
    lock.title = locked ? 'Unlock' : 'Lock';
  });
}

function saveStat(rowId){
  const row = $sheet.querySelector(`.row[data-row="${rowId}"]`);
  const w = clampInt(row.querySelector('.wstat').value);
  const l = clampInt(row.querySelector('.lstat').value);
  $status.textContent='saving…';
  root.child('stats/'+current+'/'+rowId).set({w,l})
    .then(()=>{ $status.textContent='saved ✓'; setTimeout(()=>{ if($status.textContent==='saved ✓') $status.textContent=''; },1200); })
    .catch(()=>{ $status.textContent='save failed — check rules'; });
}

// Debounced save for any per-row text node (entries=commander, tags=description).
// Timer keyed by node+rowId so the two fields don't cancel each other.
function toggleLock(rowId){
  const locked = !!(locks[current]||{})[rowId];
  const ref = root.child('locks/'+current+'/'+rowId);
  locked ? ref.remove() : ref.set(true);   // remove on unlock keeps the node clean
}

function saveField(node, rowId, val){
  $status.textContent='saving…';
  clearTimeout(saveTimers[node+rowId]);
  saveTimers[node+rowId]=setTimeout(()=>{
    root.child(node+'/'+current+'/'+rowId).set(val)
      .then(()=>{ $status.textContent='saved ✓'; setTimeout(()=>{ if($status.textContent==='saved ✓') $status.textContent=''; },1200); })
      .catch(()=>{ $status.textContent='save failed — check rules'; });
  },400);
}

function addPerson(){
  const name=(prompt('Name for the new tab?')||'').trim();
  if(!name) return;
  const ref = root.child('people').push();
  ref.set(name).then(()=>{ current=ref.key; });
}

function removePerson(id,name){
  if(!confirm('Remove '+name+' and their entries?')) return;
  root.child('people/'+id).remove();
  root.child('entries/'+id).remove();
  root.child('stats/'+id).remove();
  root.child('tags/'+id).remove();
  root.child('locks/'+id).remove();
}

// Card-art hover preview — one shared floating <img>, delegated on the sheet so it also
// catches rows built later. Image comes straight from Scryfall (fetched live, not stored).
const $preview = document.getElementById('cardpreview');
const $previewImg = $preview.querySelector('img');
let hoverTimer;
$previewImg.onerror = ()=>{ $preview.style.display='none'; };
function positionPreview(e){
  const w=250, h=352, pad=12;
  let x=e.clientX+16, y=e.clientY+16;
  if(x+w+pad > innerWidth)  x=e.clientX-w-16;
  if(y+h+pad > innerHeight) y=innerHeight-h-pad;
  if(y < pad) y=pad;
  $preview.style.left=x+'px'; $preview.style.top=y+'px';
}
$sheet.addEventListener('mouseover', e=>{
  const inp=e.target.closest('input.entry'); if(!inp || !inp.value.trim()) return;
  positionPreview(e);
  clearTimeout(hoverTimer);
  hoverTimer=setTimeout(()=>{
    $previewImg.src='https://api.scryfall.com/cards/named?format=image&version=normal&fuzzy='+encodeURIComponent(inp.value.trim());
    $preview.style.display='block';
  },200);
});
$sheet.addEventListener('mousemove', e=>{ if($preview.style.display==='block') positionPreview(e); });
$sheet.addEventListener('mouseout', e=>{
  if(!e.target.closest('input.entry')) return;
  clearTimeout(hoverTimer); $preview.style.display='none';
});

init();
</script>
</body>
</html>
