<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>32 Challenge</title>
<style>
  body{ font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; color:#1d1d1f; margin:0; padding:24px; }
  #app{ max-width:920px; margin:0 auto; }
  h1{ font-size:34px; margin:0 0 2px; font-weight:700; letter-spacing:-.5px; }
  .sub{ font-size:13px; color:#6b6b70; margin-bottom:16px; }
  .shared-note{ color:#8a6d3b; }
  .tabs{ display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-bottom:16px; }
  .tab{ padding:7px 14px; border:1px solid #d8d8dc; background:#f5f5f7; border-radius:999px; cursor:pointer; font-size:14px; color:#333; display:flex; align-items:center; gap:6px; }
  .tab.active{ background:#1d1d1f; color:#fff; border-color:#1d1d1f; }
  .tab .x{ opacity:.5; font-size:13px; }
  .tab .x:hover{ opacity:1; }
  .add{ padding:7px 12px; border:1px dashed #bbb; background:none; border-radius:999px; cursor:pointer; font-size:14px; color:#555; }
  .status{ font-size:13px; color:#8a8a8f; margin-bottom:10px; min-height:18px; }
  .sheet{ display:grid; grid-template-columns:1fr 1fr; gap:6px 28px; }
  @media (max-width:640px){ .sheet{ grid-template-columns:1fr; } }
  .row{ display:flex; align-items:center; gap:10px; padding:4px 0; }
  .pips{ display:flex; gap:3px; width:132px; flex:none; }
  .pip{ width:22px; height:22px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:800; box-shadow:inset 0 0 0 1px rgba(0,0,0,.12); }
  .name-tag{ font-size:10px; color:#9a9aa0; width:60px; flex:none; margin-left:-4px; }
  input.entry{ flex:1; border:none; border-bottom:1px solid #cfcfd4; background:none; padding:5px 2px; font-size:14px; color:#1d1d1f; outline:none; min-width:0; }
  input.entry:focus{ border-bottom-color:#1d1d1f; }
</style>
</head>
<body>
<div id="app">
  <h1>32 Challenge</h1>
  <div class="sub">Commander color-identity tracker · <span class="shared-note">live-shared with everyone who has this link</span></div>
  <div id="tabs" class="tabs"></div>
  <div id="status" class="status">Connecting…</div>
  <div id="sheet" class="sheet"></div>
</div>

<!-- Firebase (compat build = no bundler needed) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>
/* ============================================================
   1) PASTE YOUR FIREBASE CONFIG HERE (see the setup steps).
   Only databaseURL + apiKey + projectId are strictly needed
   for Realtime Database, but paste the whole object.
   ============================================================ */
const firebaseConfig = {
  apiKey: "PASTE_ME",
  authDomain: "your-project.firebaseapp.com",
  databaseURL: "https://your-project-default-rtdb.firebaseio.com",
  projectId: "your-project"
};
/* ============================================================ */

const P = {
  W:{bg:'#f3edc9',fg:'#5c5324'}, U:{bg:'#2673b8',fg:'#fff'}, B:{bg:'#2b2b2b',fg:'#dcdcdc'},
  R:{bg:'#d3413c',fg:'#fff'}, G:{bg:'#1a9e5f',fg:'#fff'}, C:{bg:'#b0a9a3',fg:'#fff'}
};
const IDENTITIES = [
  {id:'w',name:'White',c:['W']},{id:'u',name:'Blue',c:['U']},{id:'b',name:'Black',c:['B']},
  {id:'r',name:'Red',c:['R']},{id:'g',name:'Green',c:['G']},
  {id:'wu',name:'Azorius',c:['W','U']},{id:'ub',name:'Dimir',c:['U','B']},{id:'br',name:'Rakdos',c:['B','R']},
  {id:'rg',name:'Gruul',c:['R','G']},{id:'gw',name:'Selesnya',c:['G','W']},{id:'wb',name:'Orzhov',c:['W','B']},
  {id:'ur',name:'Izzet',c:['U','R']},{id:'bg',name:'Golgari',c:['B','G']},{id:'rw',name:'Boros',c:['R','W']},
  {id:'gu',name:'Simic',c:['G','U']},
  {id:'gwu',name:'Bant',c:['G','W','U']},{id:'wub',name:'Esper',c:['W','U','B']},{id:'ubr',name:'Grixis',c:['U','B','R']},
  {id:'brg',name:'Jund',c:['B','R','G']},{id:'rgw',name:'Naya',c:['R','G','W']},
  {id:'wbg',name:'Abzan',c:['W','B','G']},{id:'urw',name:'Jeskai',c:['U','R','W']},{id:'bgu',name:'Sultai',c:['B','G','U']},
  {id:'rwb',name:'Mardu',c:['R','W','B']},{id:'gur',name:'Temur',c:['G','U','R']},
  {id:'wubr',name:'Artifice',c:['W','U','B','R']},{id:'ubrg',name:'Chaos',c:['U','B','R','G']},
  {id:'brgw',name:'Aggro',c:['B','R','G','W']},{id:'rgwu',name:'Altruism',c:['R','G','W','U']},
  {id:'gwub',name:'Growth',c:['G','W','U','B']},
  {id:'wubrg',name:'5-color',c:['W','U','B','R','G']},{id:'c',name:'Colorless',c:['C']}
];

const $tabs = document.getElementById('tabs');
const $sheet = document.getElementById('sheet');
const $status = document.getElementById('status');

let db, root;
let people = {};      // pushId -> name
let entries = {};     // pushId -> {rowId: text}
let current = null;   // pushId
let builtFor = null;  // which pushId the sheet DOM is built for
const saveTimers = {};

function pips(colors){
  return '<div class="pips">' + colors.map(k=>{
    const p=P[k]; return `<span class="pip" style="background:${p.bg};color:${p.fg}">${k}</span>`;
  }).join('') + '</div>';
}

function start(){
  try{
    firebase.initializeApp(firebaseConfig);
    db = firebase.database();
    root = db.ref('challenge');
  }catch(e){
    $status.textContent = 'Firebase not configured — paste your config at the top of the file.';
    return;
  }
  root.on('value', snap=>{
    const data = snap.val() || {};
    people = data.people || {};
    entries = data.entries || {};
    const ids = Object.keys(people);
    if(!current || !ids.includes(current)) current = ids[0] || null;
    renderTabs();
    renderSheet();
    $status.textContent = '';
  }, err=>{
    $status.textContent = 'Read failed — check your database rules.';
  });
}

function renderTabs(){
  $tabs.innerHTML='';
  Object.entries(people).forEach(([id,name])=>{
    const b=document.createElement('div');
    b.className='tab'+(id===current?' active':'');
    b.innerHTML=`<span class="lbl"></span><span class="x">✕</span>`;
    b.querySelector('.lbl').textContent=name;
    b.querySelector('.lbl').onclick=()=>{ current=id; renderSheet(); renderTabs(); };
    b.querySelector('.x').onclick=(e)=>{ e.stopPropagation(); removePerson(id,name); };
    $tabs.appendChild(b);
  });
  const add=document.createElement('button');
  add.className='add'; add.textContent='+ add person'; add.onclick=addPerson;
  $tabs.appendChild(add);
}

function renderSheet(){
  if(!current){ $sheet.innerHTML='<div class="sub">No players yet — add one to start.</div>'; builtFor=null; return; }
  // Rebuild DOM only when switching person; otherwise just refresh values (keeps focus/cursor).
  if(builtFor !== current){
    $sheet.innerHTML='';
    IDENTITIES.forEach(idn=>{
      const row=document.createElement('div'); row.className='row';
      row.innerHTML = pips(idn.c) + `<span class="name-tag">${idn.name}</span>`;
      const inp=document.createElement('input');
      inp.className='entry'; inp.placeholder='commander…'; inp.dataset.row=idn.id;
      inp.oninput=()=>saveEntry(idn.id, inp.value);
      row.appendChild(inp);
      $sheet.appendChild(row);
    });
    builtFor = current;
  }
  const data = entries[current] || {};
  $sheet.querySelectorAll('input.entry').forEach(inp=>{
    if(inp !== document.activeElement) inp.value = data[inp.dataset.row] || '';
  });
}

function saveEntry(rowId, val){
  $status.textContent='saving…';
  clearTimeout(saveTimers[rowId]);
  saveTimers[rowId]=setTimeout(()=>{
    root.child('entries/'+current+'/'+rowId).set(val)
      .then(()=>{ $status.textContent='saved ✓'; setTimeout(()=>{ if($status.textContent==='saved ✓') $status.textContent=''; },1200); })
      .catch(()=>{ $status.textContent='save failed — check rules'; });
  },400);
}

function addPerson(){
  const name=(prompt('Name for the new tab?')||'').trim();
  if(!name) return;
  const ref = root.child('people').push();
  ref.set(name).then(()=>{ current=ref.key; });
}

function removePerson(id,name){
  if(!confirm('Remove '+name+' and their entries?')) return;
  root.child('people/'+id).remove();
  root.child('entries/'+id).remove();
}

start();
</script>
</body>
</html>
